<title>Buddy Maker</title>
<meta name="apple-mobile-web-app-title" content="Buddy Maker">
<style>
/* Layout: one full-screen SVG stage (lab / map / places) with big round HTML buttons on top. Single bright look; nothing needs reading. */
:root {
  --ink: #3a1a3c;
  --paper: #fffaf2;
  --purple: #8e44d6;
  --sun: #ffd23f;
  --go: #2fbf71;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #b9a4ff; color: var(--ink);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', system-ui, sans-serif; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
.rb { border-radius: 50%; border: 6px solid var(--paper); background: var(--purple); box-shadow: 0 6px 0 #4b1f7a; display: grid; place-items: center; padding: 0; cursor: pointer; transition: transform .12s; }
.rb:active { transform: scale(.92); }
.rb svg { width: 62%; height: 62%; }
.nudge { animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-12px) scale(1.1); } }
#homeBtn { position: fixed; z-index: 6; width: 84px; height: 84px; top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); }
#beepHud { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 112px); display: flex; align-items: center; gap: 8px; }
#beepBtn { width: 96px; height: 96px; background: #d2ccf4; box-shadow: 0 6px 0 #6d5fb0; }
#beepBtn svg { width: 86%; height: 86%; }
#beepBtn.talk { animation: talk .25s ease-in-out infinite alternate; }
@keyframes talk { to { transform: translateY(-5px) rotate(4deg); } }
#ask { min-width: 90px; height: 96px; border-radius: 30px; background: var(--paper); border: 5px solid var(--ink); display: grid; place-items: center; padding: 0 12px; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
#ask svg { height: 78px; }
#stars { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 18px); display: flex; align-items: center; gap: 4px; background: rgba(255,250,242,.85); border: 4px solid var(--ink); border-radius: 40px; padding: 4px 16px 4px 8px; font: 800 40px/1 'Trebuchet MS', sans-serif; }
#stars svg { width: 48px; height: 48px; }
#stars.pop { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.35); } }
#labUi { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); display: grid; gap: 8px; justify-items: center; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
#opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: calc(100vw - 190px); }
.opt { width: 100px; height: 100px; border-radius: 26px; border: 5px solid var(--paper); background: rgba(255,250,242,.55); box-shadow: 0 5px 0 rgba(58,26,60,.35); padding: 2px; cursor: pointer; transition: transform .12s; }
.opt svg { width: 100%; height: 100%; }
.opt.on { background: var(--sun); transform: translateY(-6px); }
.opt.new { animation: nudge 1s ease-in-out infinite; border-color: var(--sun); }
#tabs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tab { width: 82px; height: 82px; }
.tab.on { background: #ff6fb5; box-shadow: 0 6px 0 #a12d68; transform: translateY(-6px); }
#goBtn { position: fixed; z-index: 6; right: calc(env(safe-area-inset-right, 0px) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); width: 140px; height: 140px; border-width: 8px; background: var(--go); box-shadow: 0 8px 0 #146b3d; }
#kindPick { position: fixed; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; gap: 6vw; background: radial-gradient(circle at 50% 40%, #e8dcff, #9b7cf0); }
.kind { width: min(36vw, 340px); height: min(36vw, 340px); border-radius: 50px; border: 10px solid var(--paper); background: rgba(255,250,242,.6); box-shadow: 0 10px 0 #4b1f7a; padding: 0; cursor: pointer; animation: nudge 1.6s ease-in-out infinite; }
.kind:nth-child(2) { animation-delay: .8s; }
.kind svg { width: 100%; height: 100%; }
#mapUi { position: fixed; z-index: 5; right: calc(env(safe-area-inset-right, 0px) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; gap: 18px; }
#mapUi .rb { width: 120px; height: 120px; }
#start { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #ffb3e0, #8e44d6 70%); }
#start .wrap { display: grid; justify-items: center; gap: 10px; }
#start svg.hero { width: min(70vw, 620px); height: auto; }
#playBtn { width: 180px; height: 180px; border-width: 10px; background: #ff6fb5; box-shadow: 0 12px 0 #a12d68; animation: nudge 1.4s ease-in-out infinite; }
#playBtn svg { margin-left: 14px; }
#fade { position: fixed; inset: 0; z-index: 8; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
#fade.on { opacity: 1; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

/* svg bits */
.eye { transform-box: fill-box; transform-origin: center; transition: transform .08s; }
.blink .eye { transform: scaleY(.12); }
.breathe { animation: br 2.4s ease-in-out infinite; }
@keyframes br { 50% { transform: scale(1.025, .975); } }
.armL, .armR { animation: wave 1.8s ease-in-out infinite; }
.armR { animation-delay: .9s; }
@keyframes wave { 50% { transform: rotate(-14deg); } }
.dance .armL, .dance .armR { animation: wave2 .3s ease-in-out infinite; }
@keyframes wave2 { 50% { transform: rotate(-60deg); } }
.wingL, .wingR { animation: flap .5s ease-in-out infinite; transform-box: fill-box; }
.wingL { transform-origin: right center; } .wingR { transform-origin: left center; }
@keyframes flap { 50% { transform: rotate(-25deg); } }
.wingR { animation-name: flapR; } @keyframes flapR { 50% { transform: rotate(25deg); } }
.blinky { animation: blinky .6s steps(2) infinite; }
@keyframes blinky { 50% { opacity: .25; } }
.spinP { animation: spinP .25s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spinP { to { transform: rotate(360deg); } }
.ti { transform-box: fill-box; transform-origin: 50% 100%; }
.wig { animation: wig .5s ease-in-out; }
@keyframes wig { 25% { transform: rotate(-6deg) scale(1.05); } 75% { transform: rotate(6deg) scale(1.05); } }
.squish { animation: squish .5s ease-out; }
@keyframes squish { 30% { transform: scale(1.3, .6); } 60% { transform: scale(.85, 1.2); } }
.glow { animation: glow .8s ease-in-out infinite; }
@keyframes glow { 50% { transform: scale(1.12); filter: drop-shadow(0 0 18px #fff6a0); } }
.jiggle { animation: jiggle 1.6s ease-in-out infinite; }
@keyframes jiggle { 50% { transform: scale(1.04, .96); } }
.sway { animation: sway 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sway { 50% { transform: rotate(5deg); } }
.place { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .nudge, .kind, #playBtn, .breathe, .armL, .armR { animation: none; } }
</style>

<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gPark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd4ff"/><stop offset="1" stop-color="#d9f4ff"/></linearGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d6fd0"/><stop offset="1" stop-color="#0b2f73"/></linearGradient>
    <linearGradient id="gMoon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07061f"/><stop offset="1" stop-color="#2a1a5e"/></linearGradient>
    <linearGradient id="gLab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dcff"/><stop offset="1" stop-color="#c3aef7"/></linearGradient>
    <linearGradient id="gMap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fc8ff"/><stop offset="1" stop-color="#2d8fe0"/></linearGradient>
  </defs>

</svg>

<button class="rb" id="homeBtn" aria-label="Map" hidden><svg viewBox="0 0 64 64"><path d="M8 32 32 10l24 22h-7v22H15V32z" fill="#fffaf2" stroke="#3a1a3c" stroke-width="4" stroke-linejoin="round"/><rect x="26" y="38" width="12" height="16" rx="3" fill="#ffd23f" stroke="#3a1a3c" stroke-width="3"/></svg></button>
<div id="beepHud" hidden><button class="rb" id="beepBtn" aria-label="Beep"></button><div id="ask" hidden></div></div>
<div id="stars"><svg viewBox="-12 -12 24 24"><path id="starPath" fill="#ffd23f" stroke="#3a1a3c" stroke-width="2" stroke-linejoin="round"/></svg><span id="starN">0</span></div>

  <button class="rb" id="tinyBtn" aria-label="Make a tiny buddy" style="background:#ff6fb5;box-shadow:0 6px 0 #a12d68"></button>
  <button class="rb" id="labBtn" aria-label="Change my buddy"><svg viewBox="0 0 64 64"><path d="M44 6 58 20 26 52 10 56 14 40z" fill="#ffd23f" stroke="#3a1a3c" stroke-width="4" stroke-linejoin="round"/><path d="M14 40 26 52" stroke="#3a1a3c" stroke-width="4"/><circle cx="14" cy="52" r="5" fill="#ff6fb5"/></svg></button>
</div>
<div id="start"><div class="wrap"><svg class="hero" id="startArt" viewBox="0 0 800 380"></svg><button class="rb" id="playBtn" aria-label="Play"><svg viewBox="0 0 64 64"><path d="M14 6 58 32 14 58z" fill="#fffaf2" stroke="#3a1a3c" stroke-width="5" stroke-linejoin="round"/></svg></button></div></div>
<div id="fade"></div>

<script>
(() => {
'use strict';
const S = { name: 'Claire' };
try { Object.assign(S, JSON.parse(localStorage.getItem('claire-adv-settings') || '{}')); } catch {}
const KEY = 'claire-buddies-v1';
let st = { hero: null, buds: [], unlocked: 1, done: {}, stars: 0, parts: [], fresh: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.hero) st = Object.assign(st, s); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };

const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NS = 'http://www.w3.org/2000/svg', ink = '#3a1a3c';
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = (c) => Math.round(k > 0 ? c * (1 - k) : c + (255 - c) * -k); return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join(''); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const svg = $('#stage'), L = { bg: $('#bg'), things: $('#things'), actors: $('#actors'), fx: $('#fx') };
function svgEl(tag, attrs, parent, html) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (html) n.innerHTML = html; (parent || L.fx).appendChild(n); return n; }
const starD = (R = 11, r = 5) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; d += (i ? 'L' : 'M') + (q * Math.cos(a)).toFixed(1) + ',' + (q * Math.sin(a)).toFixed(1); } return d + 'Z'; };
$('#starPath').setAttribute('d', starD());

/* ---------------- sound ---------------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { AC.resume?.(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  master = AC.createGain(); master.gain.value = 0.8;
  const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(master); s.start(0);
}
function tone(f, dur, { type = 'sine', vol = 0.2, f2, at = 0, attack = 0.008 } = {}) {
  if (!AC) return; const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, { vol = 0.2, freq = 2000, f2, q = 1, type = 'bandpass', at = 0 } = {}) {
  if (!AC) return; const t = AC.currentTime + at, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q; if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
function melody(notes, { bpm = 160, type = 'triangle', vol = 0.14, at = 0 } = {}) { let t = at; const b = 60 / bpm; for (const [n, l] of notes) { if (n) tone(N(n), l * b * 0.95, { type, vol, at: t }); t += l * b; } }
const SFX = {
  pop: () => tone(480, 0.12, { f2: 1100, vol: 0.25 }),
  boing: (k = 1) => { tone(130 * k, 0.2, { type: 'triangle', f2: 600 * k, vol: 0.25 }); tone(600 * k, 0.35, { type: 'triangle', f2: 160 * k, vol: 0.18, at: 0.18 }); },
  bonk: () => { tone(900, 0.08, { type: 'square', vol: 0.12 }); tone(300, 0.25, { type: 'triangle', f2: 120, vol: 0.25 }); },
  thud: () => { tone(110, 0.3, { f2: 40, vol: 0.4 }); noise(0.15, { freq: 300, vol: 0.3 }); },
  splash: () => { noise(0.7, { freq: 1500, f2: 500, q: 0.6, vol: 0.35 }); for (let i = 0; i < 6; i++) tone(rand(800, 1600), 0.08, { vol: 0.06, at: rand(0, .4) }); },
  whoosh: () => noise(0.5, { freq: 400, f2: 3000, q: 0.8, vol: 0.25 }),
  slide: () => tone(900, 0.7, { type: 'triangle', f2: 200, vol: 0.12 }),
  squeak: () => tone(1400, 0.1, { type: 'square', f2: 2200, vol: 0.05 }),
  giggle: (k = 1) => { for (let i = 0; i < 6; i++) tone((700 + (i % 2) * 260) * k, 0.07, { type: 'triangle', vol: 0.12, at: i * 0.09 }); },
  chomp: () => { for (let i = 0; i < 3; i++) { noise(0.06, { freq: 900, vol: 0.3, at: i * 0.16 }); tone(160, 0.07, { type: 'square', vol: 0.08, at: i * 0.16 }); } },
  sneezeUp: () => [0, .35, .7].forEach((t, i) => tone(300 + i * 120, 0.3, { type: 'triangle', f2: 420 + i * 120, vol: 0.08, at: t })),
  choo: () => { noise(0.5, { freq: 2500, f2: 600, q: 0.5, vol: 0.5 }); tone(500, 0.2, { type: 'sawtooth', f2: 200, vol: 0.12 }); },
  hic: () => tone(600, 0.09, { type: 'triangle', f2: 1200, vol: 0.18 }),
  zz: () => tone(140, 0.6, { type: 'sawtooth', vol: 0.025, f2: 110 }),
  raspberry: () => { for (let i = 0; i < 14; i++) tone(rand(90, 140), 0.05, { type: 'sawtooth', vol: 0.12, at: i * 0.04 }); },
  blorp: () => { tone(200, 0.15, { f2: 700, vol: 0.25 }); tone(700, 0.25, { f2: 150, vol: 0.2, at: 0.14 }); },
  snap: () => { noise(0.05, { freq: 3000, vol: 0.4 }); tone(200, 0.1, { type: 'square', vol: 0.15 }); },
  squirt: () => noise(0.4, { freq: 600, f2: 200, q: 2, vol: 0.35 }),
  bubble: () => tone(300, 0.3, { f2: 900, vol: 0.12 }),
  sparkle: () => [1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.1, at: i * 0.06 })),
  shrink: () => tone(1200, 0.6, { type: 'triangle', f2: 2400, vol: 0.1 }),
  beepboop: () => { tone(880, 0.1, { type: 'square', vol: 0.06 }); tone(660, 0.12, { type: 'square', vol: 0.06, at: 0.12 }); },
  fanfare: () => { melody([[72, 1], [76, 1], [79, 1], [84, 3]], { bpm: 300, type: 'square', vol: 0.07 }); melody([[60, 3], [64, 3]], { bpm: 300, vol: 0.1, at: 0.6 }); melody([[79, 1], [81, 1], [84, 1], [88, 4]], { bpm: 260, type: 'square', vol: 0.06, at: 1.2 }); },
  dance: () => { const ns = [60, 64, 67, 72, 67, 64, 60, 67]; ns.forEach((n, i) => { tone(N(n), 0.16, { type: 'square', vol: 0.06, at: i * 0.18 }); tone(N(n - 24), 0.16, { type: 'triangle', vol: 0.12, at: i * 0.18 }); }); },
  wrong: () => { tone(400, 0.15, { type: 'triangle', vol: 0.12 }); tone(300, 0.25, { type: 'triangle', vol: 0.12, at: 0.15 }); },
  vroom: () => tone(80, 0.8, { type: 'sawtooth', f2: 220, vol: 0.07 }),
  siren: () => { tone(620, 0.4, { f2: 980, type: 'triangle', vol: 0.07 }); tone(980, 0.4, { f2: 620, type: 'triangle', vol: 0.07, at: 0.4 }); },
};

/* ---------------- voice ---------------- */
let voice = null;
function pickVoice() { const vs = window.speechSynthesis ? speechSynthesis.getVoices() : []; voice = vs.find(v => /^en/i.test(v.lang) && /(Samantha|Karen|Moira|Tessa|Allison|Ava|Google US English)/.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakTok = 0;
function say(text, { pitch = 1.45, rate = 1.0, beep = true } = {}) {
  return new Promise((res) => {
    const words = text.replaceAll('{n}', S.name);
    if (!window.speechSynthesis) return setTimeout(res, 400 + words.length * 40);
    const my = ++speakTok, u = new SpeechSynthesisUtterance(words);
    if (voice) u.voice = voice; u.pitch = pitch; u.rate = rate;
    const b = $('#beepBtn'); if (beep) b.classList.add('talk');
    let done = false; const fin = () => { if (done) return; done = true; if (my === speakTok) b.classList.remove('talk'); res(); };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 1500 + words.length * 85);
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); } else speechSynthesis.speak(u);
  });
}
const buddySay = (a, text) => say(text, a.sp.kind === 'robot' ? { pitch: 0.7, rate: 0.95, beep: false } : { pitch: 1.9, rate: 1.1, beep: false });

/* ---------------- creature parts ---------------- */
const COLORS = { purple: '#9b5de5', pink: '#ff6fb5', blue: '#3fa9f5', green: '#4ade80', yellow: '#ffd23f', orange: '#ff8c42', red: '#ff4d6d', teal: '#2ec4b6' };
const SHAPE_NAME = { round: 'circle', square: 'square', tri: 'triangle', star: 'star', heart: 'heart', tall: 'oval' };
const BODY = {
  round: { el: (f, s, w) => `<circle cx="0" cy="-140" r="95" fill="${f}" stroke="${s}" stroke-width="${w}"/>`, top: -235, eyeY: -160, mouthY: -105, spread: 52, armX: 92, armY: -130 },
  square: { el: (f, s, w) => `<rect x="-92" y="-232" width="184" height="186" rx="34" fill="${f}" stroke="${s}" stroke-width="${w}"/>`, top: -232, eyeY: -172, mouthY: -105, spread: 56, armX: 92, armY: -130 },

/* generic pick-the-right-one task (colors, shapes, sizes) */
function pickTask({ id, rounds = 3, make, drawItems, onRight, onWrong, icon, askText, rightText, wrongText }) {
  const T = { round: 0, active: false, target: null, items: [] };
  T.start = () => { T.round = 0; T.active = true; T.next(); };
  T.next = () => { const m = make(level(id)); T.items = m.items; T.target = m.target; drawItems(T.items, T); ask(askText(T.target), icon(T.target)); };
  T.pick = (item) => gag(async () => {
    if (!T.active) { await onRight(item, true); return; }
    if (item.key === T.target) {
      await onRight(item); T.round++;
      if (T.round >= rounds) { T.active = false; await say(rightText(item.key)); await taskDone(id); }
      else { await say(rightText(item.key) + ' ' + pick(['Again!', 'One more!', 'Let\'s do another!'])); T.next(); }
    } else { await onWrong(item); await say(wrongText(item.key, T.target)); }
  });
  T.nag = () => { if (!T.active) return; say(askLine); for (const it of T.items) if (it.key === T.target && it.t) { it.t.ti.classList.add('glow'); setTimeout(() => it.t.ti.classList.remove('glow'), 4000); } };
  return T;
}

svg.addEventListener('pointerdown', (e) => {
  initAudio(); e.preventDefault();
  const tEl = e.target.closest('[data-id]'), aEl = e.target.closest('[data-actor]');
  if (scene === 'map') { if (tEl && things[tEl.dataset.id]) things[tEl.dataset.id].tap(); return; }
  if (scene === 'lab') { if (aEl && hero && !busy) { lastAct = performance.now(); gag(async () => { SFX.giggle(hero.sp.kind === 'robot' ? .7 : 1.2); await jump(hero, 120, 600, { spin: 360 }); hero.rot = 0; await squash(hero); }); } return; }
  if (scene !== 'place') return;
  if (aEl && aEl._a) { heroTap(aEl._a); return; }
  if (tEl && things[tEl.dataset.id]) { const t = things[tEl.dataset.id]; if (busy) { wig(t); return; } t.tap(); return; }
  if (busy) return;
  const p = toSvg(e.clientX, e.clientY); lastAct = performance.now();
  gag(() => walkTo(hero, p.x));
});

/* ---------------- start ---------------- */
$('#startArt').innerHTML = `<g transform="translate(250 360) scale(1.1)">${creature({ kind: 'monster', body: 'heart', color: 'purple', eyes: 3, mouth: 'tongue', top: 'horns', arms: 'arms', feet: 'tentacles', pattern: 'spots' })}</g><g transform="translate(560 360) scale(1.1)">${creature({ kind: 'robot', body: 'square', color: 'teal', eyes: 2, mouth: 'led', top: 'siren', arms: 'claw', feet: 'wheels', pattern: 'panel' })}</g><g transform="translate(410 360) scale(.45)">${creature({ kind: 'robot', body: 'round', color: 'pink', eyes: 1, mouth: 'smile', top: 'antenna', arms: 'tiny', feet: 'spring', pattern: 'none' })}</g>`;
$('#playBtn').addEventListener('pointerdown', async (e) => {
  e.preventDefault(); initAudio(); SFX.fanfare();
  $('#start').hidden = true;
  if (st.hero) { say(`Welcome back, {n}!`); enterMap(); } else enterLab('hero');
});
window.__bm = { creature, get st() { return st; }, get scene() { return scene; }, get things() { return things; }, get busy() { return busy; }, get hero() { return hero; }, get place() { return place; }, enterPlace, enterMap, enterLab, taskDone };
})();
</script>
