<title>Claire's Adventures</title>

<style>
/* Layout: full-screen 3D dollhouse; big round paper-cutout buttons float in the corners. Single look (bright purple playroom) in both themes. */
:root {
  --plum: #3a1a5c;
  --grape: #8e44d6;
  --lilac: #ecdcff;
  --pink: #ff6fb5;
  --sun: #ffd23f;
  --paper: #fffaf2;
  --sky: #f6e3d3;
  --font: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--plum);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; font-family: var(--font); }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; }
#stage svg { width: 100%; height: 100%; display: block; }
#pip { position: fixed; z-index: 6; border: 6px solid var(--paper); border-radius: 14px; box-shadow: 0 6px 0 var(--plum); filter: saturate(.55) contrast(1.05) brightness(1.05); background: #fff; pointer-events: none; }

.hud { position: fixed; width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--paper);
  background: var(--grape); box-shadow: 0 6px 0 var(--plum); display: grid; place-items: center; cursor: pointer;
  transition: transform .12s; z-index: 5; padding: 0; }
.hud:active { transform: scale(.9); }
.hud svg { width: 52px; height: 52px; }
#homeBtn { top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); }
#bookBtn { top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px); background: var(--pink); }
#bookCount { position: absolute; bottom: -8px; right: -8px; min-width: 34px; height: 34px; border-radius: 17px; background: var(--sun);
  color: var(--plum); font: 800 20px/34px var(--font); text-align: center; border: 3px solid var(--paper); }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.15); } }
#gearBtn { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px);
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(58,26,92,.25); z-index: 5; display: grid; place-items: center; padding: 0; }
#gearBtn svg { width: 26px; height: 26px; }
#gearBtn.holding { animation: hold 1.2s linear forwards; }
@keyframes hold { to { background: var(--grape); transform: scale(1.4); } }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#start { background: radial-gradient(circle at 50% 40%, #b77cff 0%, var(--grape) 45%, var(--plum) 100%); }
#playBtn { width: 220px; height: 220px; border-radius: 50%; border: 10px solid var(--paper); background: var(--pink);
  box-shadow: 0 12px 0 #a0306f; display: grid; place-items: center; animation: pulse 1.4s ease-in-out infinite; padding: 0; cursor: pointer; }
#playBtn svg { width: 110px; height: 110px; margin-left: 18px; }
.starfield { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.starfield i { position: absolute; width: 6px; height: 6px; background: var(--paper); border-radius: 50%; opacity: .8; animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .15; transform: scale(.5); } }

#picker { background: rgba(58,26,92,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.cards { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; max-width: 900px; }
.card { width: min(300px, 70vw); aspect-ratio: 1; max-width: 100%; border-radius: 36px; border: 8px solid var(--paper); background: var(--lilac);
  box-shadow: 0 10px 0 var(--plum); padding: 0; cursor: pointer; overflow: hidden; transform: rotate(-2deg); transition: transform .15s; position: relative; }
.card:nth-child(2n) { transform: rotate(2deg); }
.card:active { transform: scale(.94); }
.card svg { width: 100%; height: 100%; display: block; }
.card .done { position: absolute; top: 10px; right: 10px; width: 64px; height: 64px; }

#book { background: rgba(58,26,92,.6); }
.page { background: var(--paper); border-radius: 28px; padding: 24px; width: min(860px, 100%); max-height: 86vh; overflow: auto; box-shadow: 0 10px 0 var(--plum);
  background-image: radial-gradient(#ead8ff 2px, transparent 2px); background-size: 26px 26px; position: relative; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 18px; }
.slot { aspect-ratio: 1; border-radius: 50%; border: 4px dashed #c9b2ee; display: grid; place-items: center; background: none; padding: 0; }
.slot.have { border: 0; filter: drop-shadow(0 0 0 var(--paper)) drop-shadow(0 4px 0 rgba(58,26,92,.35)); cursor: pointer; animation: pop .4s; }
.slot.have svg { width: 100%; height: 100%; }
.photos { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; }
.photos img { width: 160px; max-width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 10px solid #fff; border-bottom-width: 26px; box-shadow: 0 4px 0 rgba(58,26,92,.3); transform: rotate(-3deg); }
.photos img:nth-child(2n) { transform: rotate(3deg); }
.closeBtn { position: absolute; top: 10px; right: 10px; width: 70px; height: 70px; border-radius: 50%; border: 5px solid var(--paper); background: var(--grape); box-shadow: 0 5px 0 var(--plum); display: grid; place-items: center; padding: 0; }
.closeBtn svg { width: 34px; height: 34px; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } }

.flySticker { position: fixed; width: 90px; height: 90px; z-index: 20; pointer-events: none; transition: transform .9s cubic-bezier(.5,-0.3,.6,1), opacity .9s; filter: drop-shadow(0 4px 0 rgba(58,26,92,.35)); }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; transition: opacity .5s; }
#flash.on { opacity: 1; transition: none; }
#photo { position: fixed; left: 50%; top: 50%; width: min(380px, 70vw); z-index: 16; pointer-events: none; background: #fff; padding: 14px 14px 46px; box-shadow: 0 10px 30px rgba(58,26,92,.5);
  transform: translate(-50%, -50%) rotate(-6deg) scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
#photo.show { transform: translate(-50%, -50%) rotate(-4deg) scale(1); }
#photo.away { transform: translate(40vw, -45vh) rotate(20deg) scale(.1); transition: transform .8s ease-in; }
#photo img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
#pipFrame { position: fixed; z-index: 7; pointer-events: none; }
#pipFrame b { position: absolute; top: 8px; left: 10px; width: 18px; height: 18px; border-radius: 50%; background: #ff3355; animation: twinkle 1s infinite; }

#settings { background: rgba(58,26,92,.6); }
#settings .page { max-width: 520px; font-size: 18px; display: flex; flex-direction: column; gap: 16px; }
#settings h2 { margin: 0; font-size: 28px; }
#settings label { font-weight: 700; }
#settings input[type=text] { font: 600 22px var(--font); padding: 8px 12px; border-radius: 12px; border: 3px solid #c9b2ee; width: 100%; box-sizing: border-box; color: var(--plum); background: #fff; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatches button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px #c9b2ee; cursor: pointer; padding: 0; font: 700 14px var(--font); color: var(--plum); }
.swatches button.sel { box-shadow: 0 0 0 5px var(--grape); }
.swatches.words button { width: auto; height: auto; border-radius: 12px; padding: 8px 14px; background: var(--lilac); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { font: 700 20px var(--font); padding: 10px 20px; border-radius: 14px; border: 0; background: var(--grape); color: #fff; box-shadow: 0 4px 0 var(--plum); cursor: pointer; }
.btn.ghost { background: var(--lilac); color: var(--plum); }
.note { font-size: 15px; opacity: .75; margin: 0; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .pulse, #playBtn, .starfield i { animation: none; } }
</style>

</button>

<script>
(() => {
'use strict';
/* ---------------- settings & saved stuff ---------------- */
const DEFAULTS = { name: 'Claire', hair: '#a87445', skin: '#f7d6c2' };
const S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('claire-adv-settings') || '{}')); } catch {}
let owned = new Set(); try { owned = new Set(JSON.parse(localStorage.getItem('claire-adv-stickers') || '[]')); } catch {}
let finished = new Set(); try { finished = new Set(JSON.parse(localStorage.getItem('claire-adv-done') || '[]')); } catch {}
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const photos = [];
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lighten = (hex, amt) => { const n = parseInt(hex.slice(1), 16); const f = (c) => Math.round(c + (255 - c) * amt); return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join(''); };

/* ---------------- sound (all made in code) ---------------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { AC.resume?.(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.8;
  const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(master); s.start(0);
  AC.resume?.();
}
function out(pan) { if (pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(master); return p; } return master; }
function tone(f, dur, { type = 'sine', vol = 0.2, f2, at = 0, pan = 0, attack = 0.008 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out(pan)); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, { vol = 0.2, freq = 2000, f2, q = 1, type = 'bandpass', at = 0 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + at, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
function melody(notes, { bpm = 160, type = 'triangle', vol = 0.14, at = 0 } = {}) { let t = at; const b = 60 / bpm; for (const [n, l] of notes) { if (n) tone(N(n), l * b * 0.95, { type, vol, at: t }); t += l * b; } return t; }
const SFX = {
  chirp: (vol = 0.2, pan = 0) => { tone(2100, 0.06, { vol, pan }); tone(2100, 0.06, { vol, pan, at: 0.12 }); },
  pop: () => tone(480, 0.12, { f2: 1100, vol: 0.25 }),
  boing: () => { tone(130, 0.2, { type: 'triangle', f2: 600, vol: 0.28 }); tone(600, 0.35, { type: 'triangle', f2: 160, vol: 0.2, at: 0.18 }); },
  sparkle: () => [1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.1, at: i * 0.06 })),
  shutter: () => { noise(0.04, { freq: 5000, vol: 0.4, type: 'highpass' }); noise(0.06, { freq: 2500, vol: 0.3, at: 0.07 }); },
  clunk: () => { tone(110, 0.18, { type: 'square', vol: 0.12, f2: 60 }); noise(0.08, { freq: 800, vol: 0.2 }); },
  bell: (dur = 1.6) => { for (let t = 0; t < dur; t += 0.08) { tone(1250, 0.12, { type: 'triangle', vol: 0.05, at: t }); tone(1870, 0.1, { vol: 0.03, at: t }); } },
  fanfare: () => { melody([[72, 1], [76, 1], [79, 1], [84, 3]], { bpm: 300, type: 'square', vol: 0.07 }); melody([[60, 3], [64, 3]], { bpm: 300, vol: 0.1, at: 0.6 }); },
  whoopee: () => {
    if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; for (let i = 0; i < 14; i++) o.frequency.setValueAtTime(rand(70, 130), t + i * 0.05);
    f.type = 'lowpass'; f.frequency.value = 900; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.8);
  },
  squawk: () => { tone(900, 0.16, { type: 'sawtooth', f2: 480, vol: 0.1 }); tone(1000, 0.2, { type: 'sawtooth', f2: 450, vol: 0.1, at: 0.22 }); },
  tape: () => noise(0.32, { freq: 3500, f2: 1400, q: 0.7, vol: 0.2 }),
  wobble: () => { for (let i = 0; i < 8; i++) tone(i % 2 ? 300 : 240, 0.1, { vol: 0.15, at: i * 0.09 }); },
  staticN: () => noise(0.7, { type: 'highpass', freq: 3000, vol: 0.08 }),
  whoosh: () => noise(0.5, { freq: 300, f2: 3000, vol: 0.18 }),
  ding: () => { tone(1568, 0.7, { vol: 0.18 }); tone(2093, 0.6, { vol: 0.1, at: 0.02 }); },
  giggle: () => [880, 830, 790, 740, 700].forEach((f, i) => tone(f, 0.08, { type: 'triangle', vol: 0.12, at: i * 0.1, f2: f * 0.85 })),
  chatter: () => { for (let i = 0; i < 14; i++) noise(0.03, { freq: 3000, vol: 0.15, at: i * 0.06 }); },
  click: () => { tone(1800, 0.03, { type: 'square', vol: 0.1 }); tone(900, 0.04, { type: 'square', vol: 0.1, at: 0.05 }); },
  tap: () => tone(660, 0.07, { f2: 880, vol: 0.08 }),
  zap: () => tone(1500, 0.3, { type: 'sawtooth', f2: 120, vol: 0.06 }),
  shootingStar: () => { [2637, 2349, 2093, 1760, 1568].forEach((f, i) => tone(f, 0.3, { vol: 0.08, at: i * 0.07 })); noise(0.8, { freq: 6000, f2: 2000, vol: 0.05 }); },
  alien: () => { for (let i = 0; i < 6; i++) tone(500 + i * 120, 0.12, { vol: 0.12, at: i * 0.08, f2: 700 + i * 200 }); },
  disco(dur = 6) {
    for (let t = 0, i = 0; t < dur; t += 0.25, i++) {
      if (i % 2 === 0) tone(110, 0.12, { f2: 45, vol: 0.4, at: t }); else noise(0.04, { type: 'highpass', freq: 7000, vol: 0.12, at: t });
      tone(N([36, 36, 48, 36, 39, 39, 51, 41][i % 8]), 0.2, { type: 'square', vol: 0.05, at: t });
      if (i % 4 === 2) tone(N([72, 75, 79, 77][(i / 4 | 0) % 4]), 0.2, { type: 'triangle', vol: 0.07, at: t });
    }
  },
  happySong: () => melody([[72, 1], [76, 1], [79, 1], [76, 1], [84, 2], [0, 1], [79, 1], [81, 1], [79, 1], [76, 1], [72, 3]], { bpm: 220, type: 'square', vol: 0.06 }),
};

/* ---------------- speech: Beep talks to her by name ---------------- */
let voice = null;
function pickVoice() { const vs = window.speechSynthesis ? speechSynthesis.getVoices() : []; voice = vs.find(v => /^en/i.test(v.lang) && /(Samantha|Karen|Moira|Tessa|Allison|Ava|Google US English)/.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakToken = 0;
function say(text, { pitch = 1.55, rate = 1.0 } = {}) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) return setTimeout(resolve, 600);
    const my = ++speakToken, words = text.replaceAll('{n}', S.name), u = new SpeechSynthesisUtterance(words);
    if (voice) u.voice = voice; u.pitch = pitch; u.rate = rate;
    let done = false; const fin = () => { if (done) return; done = true; if (my === speakToken) beep.talking = false; resolve(my === speakToken); };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 1500 + words.length * 85);
    beep.talking = true;
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); } else speechSynthesis.speak(u);
  });
}

/* ---------------- the drawing ---------------- */
const RW = 1600, WORLD_W = RW * 3, FLOOR = 640;
const LX = 0, KX = RW, BX = RW * 2;           // living room, kitchen, Claire's room
const SVGNS = 'http://www.w3.org/2000/svg';
const ink = '#4a3550';
const thingG = (id, px, py, inner, extra = '') => `<g data-thing="${id}" transform="translate(${px} ${py})" ${extra}><g class="a"><g transform="translate(${-px} ${-py})">${inner}</g></g></g>`;
const hit = (x, y, w, h) => `<rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const shadow = (cx, cy, rx) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${Math.max(8, rx * 0.08)}" fill="#3a1a30" opacity=".12"/>`;
const cloud = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path class="o t" fill="#fff" d="M-60,10 C-70,-10 -45,-25 -30,-15 C-25,-40 15,-42 22,-18 C40,-30 66,-12 56,8 C70,14 62,32 44,30 L-48,30 C-68,30 -72,14 -60,10 Z"/></g>`;
const sun = () => '';

function shell(id, wallGrad, floorFill, ceil) {
  return `<rect x="0" y="-1400" width="${RW}" height="1446" fill="${ceil}"/>

    const k = d.taps % 3;
    if (!drawer.open) slideDrawer(true);
    const pop = (kind, line, sfx) => { sfx(); say(line); const it = spawnItem(kind, KX + 400, 470); tween(1.4, (q) => { T(it, KX + 400, 470 - Math.sin(q * Math.PI) * 160, Math.sin(q * 20) * 15); it.setAttribute('opacity', q > 0.8 ? (1 - q) * 5 : 1); }, () => it.remove()); };
    if (k === 0) pop('spoon', 'A silly spoon! Boing boing!', SFX.boing);
    if (k === 1) { pop('chicken', 'A rubber chicken! Bawk bawk!', SFX.squawk); claireLaugh(1.5); }
    if (k === 2) { slideDrawer(false); SFX.clunk(); }
  },
  install() {
    this.bat = 'installed'; claire.carry = false; setHint(null);
    const i = stuck.findIndex((s) => s.who === 'claireCarry'); if (i >= 0) stuck.splice(i, 1);
    walkTo(DET.x, 730);
    const from = { x: claire.x, y: claire.y - 420 * depth(claire.y) };
    flyItem(battery, from, () => ({ x: DET.x, y: DET.y + 20 }), 0.9, 100, () => { battery.remove(); battery = null; SFX.click(); detector.chirpOn = false; detector.fixed = true; after(0.5, () => this.win()); });
  },
  win() {
    this.step = 'done'; finished.add('beeping'); store('claire-adv-done', [...finished]);
    SFX.fanfare(); burst(claire.x, claire.y - 300, 90, 900); burst(DET.x, DET.y + 30, 40, 500, 760);
    claire.spinT = 0.6; hop(3, 80); beep.danceT = 4; setFace('love', 4);
    giveSticker('fixer', things.detector.node); after(1.4, SFX.happySong);
    say('Click! You fixed it, {n}! The smoke detector is happy now. You are a super fixer!').then(() => { if (this.step !== 'done') return; say('Now you can play with anything you want. Tap, tap, tap!'); $('#homeBtn').classList.add('pulse'); });
  },
  update(dt) {
    if (this.step === 'off' || this.step === 'done') return;
    if (this.step === 'intro' && claire.x > BX + 60) { this.step = 'look'; this.idle = 0; setHint(things.detector); say('It is getting louder! Look up high! What is beeping?'); }
    this.idle += dt;
    if (this.idle > 16) {
      this.idle = 0;
      const lines = { intro: 'Follow the beeping, {n}! I think it is in your room. Tap over there!', look: 'Look up high! Tap the beeping thing!', need: 'The battery is in the kitchen! Tap the yellow drawer!', carry: 'Tap the smoke detector to give it the battery!' };
      if (lines[this.step]) say(lines[this.step]);
      if (this.step === 'intro') setHint(things.detector);
    }
  },
};

const ADVENTURES = [
  { id: 'beeping', art: `<svg viewBox="0 0 300 300"><rect width="300" height="300" fill="#efe4f8"/><rect y="0" width="300" height="60" fill="url(#cardWater)"/><defs><pattern id="cardWater" width="80" height="60" patternUnits="userSpaceOnUse"><rect width="80" height="60" fill="#e8e1f4"/><ellipse cx="20" cy="20" rx="14" ry="6" fill="#b9c8ee"/><ellipse cx="60" cy="40" rx="12" ry="5" fill="#f2bfd6"/></pattern></defs><path d="M98,60 h104 a52,30 0 0 1 -104,0 z" fill="#fff" stroke="${ink}" stroke-width="7"/><circle cx="180" cy="72" r="8" fill="#ff3355"/><path d="M80,118 q70,50 140,0 M60,140 q90,70 180,0" stroke="#ffd23f" stroke-width="12" fill="none" stroke-linecap="round"/><g transform="translate(150 290) scale(.62)"><rect x="-60" y="-236" width="120" height="88" rx="26" fill="#beb2f4" stroke="${ink}" stroke-width="7"/><rect x="-48" y="-226" width="96" height="66" rx="16" fill="#24103d"/><circle cx="-20" cy="-196" r="10" fill="#7ff3ff"/><circle cx="20" cy="-196" r="10" fill="#7ff3ff"/><path d="M-18,-180 q18,16 36,0" stroke="#7ff3ff" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="-48" y="-138" width="96" height="98" rx="30" fill="#d2ccf4" stroke="${ink}" stroke-width="7"/></g></svg>`, start: () => story.start() },
];
function renderCards() {
  const wrap = $('#cards'); wrap.innerHTML = '';
  for (const a of ADVENTURES) {
    const b = document.createElement('button'); b.className = 'card'; b.setAttribute('aria-label', a.id);
    b.innerHTML = a.art + (finished.has(a.id) ? `<svg class="done" viewBox="0 0 64 64"><path d="M32 4l8 17 19 2-14 13 4 19-17-10-17 10 4-19L5 23l19-2z" fill="#ffd23f" stroke="${ink}" stroke-width="3"/></svg>` : '');
    b.addEventListener('click', () => { initAudio(); SFX.pop(); $('#picker').hidden = true; playing = true; $('#homeBtn').classList.remove('pulse'); a.start(); });
    wrap.appendChild(b);
  }
}

/* ---------------- input ---------------- */
let playing = false, down = null;
function toWorld(cx, cy) { const p = world.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(el('worldG').getScreenCTM().inverse()); }
world.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
world.addEventListener('pointerup', (e) => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 24 || !playing) return;
  initAudio(); story.idle = 0;
  const tn = e.target.closest('[data-thing]');
  if (tn) { const d = things[tn.dataset.thing]; if (!d) return; d.taps++; if (d.approach) walkTo(d.approach[0], d.approach[1]); d.tap(d); if (STICKERS[d.id]) giveSticker(d.id, d.node); return; }
  if (e.target.closest('#claire')) { SFX.giggle(); claire.spinT = 0.5; hop(1, 80); claireLaugh(1); const p = claireHeadPos(); burst(p.x, p.y, 20, 400); return; }
  const p = toWorld(e.clientX, e.clientY);
  const y = p.y < FLOOR ? 740 : p.y; walkTo(p.x, y); ripple(clamp(p.x, 80, WORLD_W - 80), clamp(y, 690, 870)); SFX.tap();
});

/* buttons & overlays */
const starsEl = $('#stars'); for (let i = 0; i < 40; i++) { const s = document.createElement('i'); s.style.left = rand(0, 100) + '%'; s.style.top = rand(0, 100) + '%'; s.style.animationDelay = rand(0, 2) + 's'; starsEl.appendChild(s); }
$('#playBtn').addEventListener('click', () => { initAudio(); SFX.sparkle(); say('Hi {n}! Pick an adventure!'); $('#start').hidden = true; $('#homeBtn').hidden = false; $('#bookBtn').hidden = false; renderCards(); $('#picker').hidden = false; });
$('#homeBtn').addEventListener('click', () => { initAudio(); SFX.pop(); playing = false; story.step = 'off'; story.token++; detector.chirpOn = false; setHint(null); renderCards(); $('#picker').hidden = false; say('Pick an adventure, {n}!'); });
function renderBook() {
  const slots = $('#slots'); slots.innerHTML = '';
  for (const id of Object.keys(STICKERS)) {
    const b = document.createElement('button'); b.className = 'slot' + (owned.has(id) ? ' have' : ''); b.setAttribute('aria-label', owned.has(id) ? STICKERS[id][0] : 'Empty sticker spot');
    if (owned.has(id)) { b.innerHTML = stickerSvg(id); b.addEventListener('click', () => { SFX.sparkle(); say(STICKERS[id][0] + '!'); b.animate([{ transform: 'scale(1.25) rotate(8deg)' }, { transform: 'scale(1)' }], { duration: 350 }); }); }
    slots.appendChild(b);
  }
  const ph = $('#photos'); ph.innerHTML = ''; for (const p of photos) { const im = document.createElement('img'); im.src = p; im.alt = 'Game photo'; ph.appendChild(im); }
}
$('#bookBtn').addEventListener('click', () => { initAudio(); SFX.pop(); renderBook(); $('#book').hidden = false; say(owned.size ? 'Your sticker book!' : 'Tap things to find stickers!'); });
$('#bookClose').addEventListener('click', () => { SFX.pop(); $('#book').hidden = true; });

let holdTimer = null; const gear = $('#gearBtn');
gear.addEventListener('pointerdown', () => { gear.classList.add('holding'); holdTimer = setTimeout(openSettings, 1200); });
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => gear.addEventListener(ev, () => { gear.classList.remove('holding'); clearTimeout(holdTimer); }));
const HAIRS = ['#a87445', '#c49056', '#e3b25b', '#6b4226', '#2a1a12', '#b5452a', '#8e44d6'];
const SKINS = ['#f7d6c2', '#fde2cf', '#e0ac85', '#b97b55', '#8a5536', '#5b3824'];
function applyLook() { world.style.setProperty('--hair', S.hair); world.style.setProperty('--hairhi', lighten(S.hair, 0.28)); world.style.setProperty('--skin', S.skin);
  const nm = S.name.toUpperCase().slice(0, 8), cols = ['#9fb3ff', '#ff8fb8', '#d9a647', '#b48be9', '#ffb0de', '#7fcfb8', '#ff9e7a', '#9fb3ff'];
  el('pillowName').innerHTML = [...nm].map((c, i) => `<tspan fill="${cols[i % cols.length]}">${c.replace(/[<&>]/g, '')}</tspan>`).join(''); }
function swatches(box, list, key) { box.innerHTML = ''; for (const v of list) { const b = document.createElement('button'); b.style.background = v; b.setAttribute('aria-label', v); if (S[key] === v) b.classList.add('sel'); b.addEventListener('click', () => { S[key] = v; store('claire-adv-settings', S); applyLook(); swatches(box, list, key); }); box.appendChild(b); } }
function openSettings() { gear.classList.remove('holding'); $('#setName').value = S.name; swatches($('#hairSw'), HAIRS, 'hair'); swatches($('#skinSw'), SKINS, 'skin'); $('#settings').hidden = false; }
$('#setName').addEventListener('input', (e) => { S.name = e.target.value.trim() || DEFAULTS.name; store('claire-adv-settings', S); applyLook(); });
$('#setDone').addEventListener('click', () => { $('#settings').hidden = true; });
$('#setTest').addEventListener('click', () => { initAudio(); say('Hi {n}! I am Beep, your robot buddy!'); });
$('#setReset').addEventListener('click', (e) => {
  if (e.target.dataset.sure) { owned.clear(); finished.clear(); store('claire-adv-stickers', []); store('claire-adv-done', []); updateBookCount(); e.target.textContent = 'Stickers cleared'; delete e.target.dataset.sure; }
  else { e.target.dataset.sure = '1'; e.target.textContent = 'Tap again to clear'; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) AC.resume?.(); });

/* ---------------- loop ---------------- */
let camX = 0, last = performance.now(), clockT = 0;
const pip = $('#pip'), pipFrame = $('#pipFrame');
pip.setAttribute('xmlns', SVGNS); pip.innerHTML = '<use href="#worldG"/>';
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clockT += dt; const t = clockT;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done?.(); } }
  for (let i = timers.length - 1; i >= 0; i--) { const tm = timers[i]; tm.t -= dt; if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); } }
  updateClaire(dt, t); updateBeep(dt, t);
  for (const id in things) things[id].update?.(dt, t);
  story.update(dt); updateStuck(dt);
  for (let i = confetti.length - 1; i >= 0; i--) { const c = confetti[i]; c.life -= dt; c.vy += (c.g ?? 1400) * dt; c.vx *= 0.985; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; if (c.y > c.floor) { c.y = c.floor; c.vx = 0; c.vy = 0; c.vr = 0; } c.el.setAttribute('transform', `translate(${c.x} ${c.y}) rotate(${c.rot})`); if (c.life < 0.5) c.el.setAttribute('opacity', Math.max(0, c.life * 2)); if (c.life <= 0) { c.el.remove(); confetti.splice(i, 1); } }
  if (hintTarget) { const [hx, hy] = hintTarget.hint; const s = 1 + Math.sin(t * 6) * 0.12; hintStar.setAttribute('transform', `translate(${hx} ${hy + Math.sin(t * 4) * 12}) rotate(${Math.sin(t * 2) * 15}) scale(${s})`); }

  const aspect = innerWidth / innerHeight;
  const vw = Math.max(1250, 900 * aspect), vh = vw / aspect;
  const target = clamp(claire.x - vw / 2, 0, WORLD_W - vw);
  camX += (target - camX) * Math.min(1, dt * 2.6);
  world.setAttribute('viewBox', `${camX.toFixed(1)} ${(900 - vh).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);

  if (sec.pip > 0) {
    const w = Math.min(innerWidth * 0.34, 320), h = w * 0.75, x = innerWidth - w - 20, y = innerHeight - h - 20;
    const p = claireHeadPos(); pip.setAttribute('viewBox', `${p.x - 260} ${p.y - 60} 520 390`);
    Object.assign(pip.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); pip.hidden = false;
    Object.assign(pipFrame.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); pipFrame.hidden = false;
  } else { pip.hidden = true; pipFrame.hidden = true; }
  requestAnimationFrame(frame);
}
updateBookCount();
requestAnimationFrame(frame);
})();
</script>
