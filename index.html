<title>Claire's Adventures</title>

<style>
/* Layout: full-screen 3D dollhouse; big round paper-cutout buttons float in the corners. Single look (bright purple playroom) in both themes. */
:root {
  --plum: #3a1a5c;
  --grape: #8e44d6;
  --lilac: #ecdcff;
  --pink: #ff6fb5;
  --sun: #ffd23f;
  --paper: #fffaf2;
  --sky: #cdb6f5;
  --font: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--plum);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; font-family: var(--font); }
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud { position: fixed; width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--paper);
  background: var(--grape); box-shadow: 0 6px 0 var(--plum); display: grid; place-items: center; cursor: pointer;
  transition: transform .12s; z-index: 5; padding: 0; }
.hud:active { transform: scale(.9); }
.hud svg { width: 52px; height: 52px; }
#homeBtn { top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); }
#bookBtn { top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px); background: var(--pink); }
#bookCount { position: absolute; bottom: -8px; right: -8px; min-width: 34px; height: 34px; border-radius: 17px; background: var(--sun);
  color: var(--plum); font: 800 20px/34px var(--font); text-align: center; border: 3px solid var(--paper); }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.15); } }
#gearBtn { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px);
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(58,26,92,.25); z-index: 5; display: grid; place-items: center; padding: 0; }
#gearBtn svg { width: 26px; height: 26px; }
#gearBtn.holding { animation: hold 1.2s linear forwards; }
@keyframes hold { to { background: var(--grape); transform: scale(1.4); } }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#start { background: radial-gradient(circle at 50% 40%, #b77cff 0%, var(--grape) 45%, var(--plum) 100%); }
#playBtn { width: 220px; height: 220px; border-radius: 50%; border: 10px solid var(--paper); background: var(--pink);
  box-shadow: 0 12px 0 #a0306f; display: grid; place-items: center; animation: pulse 1.4s ease-in-out infinite; padding: 0; cursor: pointer; }
#playBtn svg { width: 110px; height: 110px; margin-left: 18px; }
.starfield { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.starfield i { position: absolute; width: 6px; height: 6px; background: var(--paper); border-radius: 50%; opacity: .8; animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .15; transform: scale(.5); } }

#picker { background: rgba(58,26,92,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.cards { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; max-width: 900px; }
.card { width: min(300px, 70vw); aspect-ratio: 1; max-width: 100%; border-radius: 36px; border: 8px solid var(--paper); background: var(--lilac);
  box-shadow: 0 10px 0 var(--plum); padding: 0; cursor: pointer; overflow: hidden; transform: rotate(-2deg); transition: transform .15s; position: relative; }
.card:nth-child(2n) { transform: rotate(2deg); }
.card:active { transform: scale(.94); }
.card svg { width: 100%; height: 100%; display: block; }
.card .done { position: absolute; top: 10px; right: 10px; width: 64px; height: 64px; }

#book { background: rgba(58,26,92,.6); }
.page { background: var(--paper); border-radius: 28px; padding: 24px; width: min(860px, 100%); max-height: 86vh; overflow: auto; box-shadow: 0 10px 0 var(--plum);
  background-image: radial-gradient(#ead8ff 2px, transparent 2px); background-size: 26px 26px; position: relative; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 18px; }
.slot { aspect-ratio: 1; border-radius: 50%; border: 4px dashed #c9b2ee; display: grid; place-items: center; background: none; padding: 0; }
.slot.have { border: 0; filter: drop-shadow(0 0 0 var(--paper)) drop-shadow(0 4px 0 rgba(58,26,92,.35)); cursor: pointer; animation: pop .4s; }
.slot.have svg { width: 100%; height: 100%; }
.photos { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; }
.photos img { width: 160px; max-width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 10px solid #fff; border-bottom-width: 26px; box-shadow: 0 4px 0 rgba(58,26,92,.3); transform: rotate(-3deg); }
.photos img:nth-child(2n) { transform: rotate(3deg); }
.closeBtn { position: absolute; top: 10px; right: 10px; width: 70px; height: 70px; border-radius: 50%; border: 5px solid var(--paper); background: var(--grape); box-shadow: 0 5px 0 var(--plum); display: grid; place-items: center; padding: 0; }
.closeBtn svg { width: 34px; height: 34px; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } }

.flySticker { position: fixed; width: 90px; height: 90px; z-index: 20; pointer-events: none; transition: transform .9s cubic-bezier(.5,-0.3,.6,1), opacity .9s; filter: drop-shadow(0 4px 0 rgba(58,26,92,.35)); }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; transition: opacity .5s; }
#flash.on { opacity: 1; transition: none; }
#photo { position: fixed; left: 50%; top: 50%; width: min(380px, 70vw); z-index: 16; pointer-events: none; background: #fff; padding: 14px 14px 46px; box-shadow: 0 10px 30px rgba(58,26,92,.5);
  transform: translate(-50%, -50%) rotate(-6deg) scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
#photo.show { transform: translate(-50%, -50%) rotate(-4deg) scale(1); }
#photo.away { transform: translate(40vw, -45vh) rotate(20deg) scale(.1); transition: transform .8s ease-in; }
#photo img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
#pipFrame { position: fixed; z-index: 6; border: 6px solid var(--paper); border-radius: 14px; box-shadow: 0 6px 0 var(--plum); pointer-events: none; }
#pipFrame b { position: absolute; top: 8px; left: 10px; width: 18px; height: 18px; border-radius: 50%; background: #ff3355; animation: twinkle 1s infinite; }

#settings { background: rgba(58,26,92,.6); }
#settings .page { max-width: 520px; font-size: 18px; display: flex; flex-direction: column; gap: 16px; }
#settings h2 { margin: 0; font-size: 28px; }
#settings label { font-weight: 700; }
#settings input[type=text] { font: 600 22px var(--font); padding: 8px 12px; border-radius: 12px; border: 3px solid #c9b2ee; width: 100%; box-sizing: border-box; color: var(--plum); background: #fff; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatches button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px #c9b2ee; cursor: pointer; padding: 0; font: 700 14px var(--font); color: var(--plum); }
.swatches button.sel { box-shadow: 0 0 0 5px var(--grape); }
.swatches.words button { width: auto; height: auto; border-radius: 12px; padding: 8px 14px; background: var(--lilac); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { font: 700 20px var(--font); padding: 10px 20px; border-radius: 14px; border: 0; background: var(--grape); color: #fff; box-shadow: 0 4px 0 var(--plum); cursor: pointer; }
.btn.ghost { background: var(--lilac); color: var(--plum); }
.note { font-size: 15px; opacity: .75; margin: 0; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .pulse, #playBtn, .starfield i { animation: none; } }
</style>

</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------------- settings & saved stuff ---------------- */
const DEFAULTS = { name: 'Claire', hair: '#a87445', style: 'wavy', skin: '#f7d6c2' };
const S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('claire-adv-settings') || '{}')); } catch {}
let owned = new Set();
try { owned = new Set(JSON.parse(localStorage.getItem('claire-adv-stickers') || '[]')); } catch {}
let finished = new Set();
try { finished = new Set(JSON.parse(localStorage.getItem('claire-adv-done') || '[]')); } catch {}
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const photos = [];

const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

/* ---------------- sound (all made in code) ---------------- */
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { AC.resume?.(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.8;
  const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(master); s.start(0);
  AC.resume?.();
}
function out(pan) {
  if (pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(master); return p; }
  return master;
}
function tone(f, dur, { type = 'sine', vol = 0.2, f2, at = 0, pan = 0, attack = 0.008 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out(pan)); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, { vol = 0.2, freq = 2000, f2, q = 1, type = 'bandpass', at = 0 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + at, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
function melody(notes, { bpm = 160, type = 'triangle', vol = 0.14, at = 0 } = {}) {
  let t = at; const beat = 60 / bpm;
  for (const [n, b] of notes) { if (n) tone(N(n), b * beat * 0.95, { type, vol, at: t }); t += b * beat; }
  return t;
}
const SFX = {
  chirp: (vol = 0.2, pan = 0) => { tone(2100, 0.06, { vol, pan }); tone(2100, 0.06, { vol, pan, at: 0.12 }); },
  pop: () => tone(480, 0.12, { f2: 1100, vol: 0.25 }),
  boing: () => { tone(130, 0.2, { type: 'triangle', f2: 600, vol: 0.28 }); tone(600, 0.35, { type: 'triangle', f2: 160, vol: 0.2, at: 0.18 }); },
  sparkle: () => [1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.1, at: i * 0.06 })),
  shutter: () => { noise(0.04, { freq: 5000, vol: 0.4, type: 'highpass' }); noise(0.06, { freq: 2500, vol: 0.3, at: 0.07 }); },
  clunk: () => { tone(110, 0.18, { type: 'square', vol: 0.12, f2: 60 }); noise(0.08, { freq: 800, vol: 0.2 }); },
  bell: (dur = 1.6) => { for (let t = 0; t < dur; t += 0.08) { tone(1250, 0.12, { type: 'triangle', vol: 0.05, at: t }); tone(1870, 0.1, { vol: 0.03, at: t }); } },
  fanfare: () => { melody([[72, 1], [76, 1], [79, 1], [84, 3]], { bpm: 300, type: 'square', vol: 0.07 }); melody([[60, 3], [64, 3]], { bpm: 300, vol: 0.1, at: 0.6 }); },
  whoopee: () => {
    if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; for (let i = 0; i < 14; i++) o.frequency.setValueAtTime(rand(70, 130), t + i * 0.05);
    f.type = 'lowpass'; f.frequency.value = 900; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.8);
  },
  squawk: () => { tone(900, 0.16, { type: 'sawtooth', f2: 480, vol: 0.1 }); tone(1000, 0.2, { type: 'sawtooth', f2: 450, vol: 0.1, at: 0.22 }); },
  tape: () => noise(0.32, { freq: 3500, f2: 1400, q: 0.7, vol: 0.2 }),
  wobble: () => { for (let i = 0; i < 8; i++) tone(i % 2 ? 300 : 240, 0.1, { type: 'sine', vol: 0.15, at: i * 0.09 }); },
  staticN: () => noise(0.7, { type: 'highpass', freq: 3000, vol: 0.08 }),
  whoosh: () => noise(0.5, { freq: 300, f2: 3000, vol: 0.18 }),
  ding: () => { tone(1568, 0.7, { vol: 0.18 }); tone(2093, 0.6, { vol: 0.1, at: 0.02 }); },
  giggle: () => [880, 830, 790, 740, 700].forEach((f, i) => tone(f, 0.08, { type: 'triangle', vol: 0.12, at: i * 0.1, f2: f * 0.85 })),
  chatter: () => { for (let i = 0; i < 14; i++) noise(0.03, { freq: 3000, vol: 0.15, at: i * 0.06 }); },
  click: () => { tone(1800, 0.03, { type: 'square', vol: 0.1 }); tone(900, 0.04, { type: 'square', vol: 0.1, at: 0.05 }); },
  tap: () => tone(660, 0.07, { f2: 880, vol: 0.08 }),
  zap: () => tone(1500, 0.3, { type: 'sawtooth', f2: 120, vol: 0.06 }),
  shootingStar: () => { [2637, 2349, 2093, 1760, 1568].forEach((f, i) => tone(f, 0.3, { type: 'sine', vol: 0.08, at: i * 0.07 })); noise(0.8, { freq: 6000, f2: 2000, vol: 0.05 }); },
  alien: () => { for (let i = 0; i < 6; i++) tone(500 + i * 120, 0.12, { type: 'sine', vol: 0.12, at: i * 0.08, f2: 700 + i * 200 }); },
  disco(dur = 6) {
    const beat = 0.25;
    for (let t = 0; t < dur; t += beat) {
      const i = Math.round(t / beat);
      if (i % 2 === 0) tone(110, 0.12, { type: 'sine', f2: 45, vol: 0.4, at: t });
      if (i % 2 === 1) noise(0.04, { type: 'highpass', freq: 7000, vol: 0.12, at: t });
      const bass = [36, 36, 48, 36, 39, 39, 51, 41][i % 8];
      tone(N(bass), 0.2, { type: 'square', vol: 0.05, at: t });
      if (i % 4 === 2) tone(N([72, 75, 79, 77][(i / 4 | 0) % 4]), 0.2, { type: 'triangle', vol: 0.07, at: t });
    }
  },
  happySong: () => melody([[72, 1], [76, 1], [79, 1], [76, 1], [84, 2], [0, 1], [79, 1], [81, 1], [79, 1], [76, 1], [72, 3]], { bpm: 220, type: 'square', vol: 0.06 }),
};

/* ---------------- speech: Beep talks to her by name ---------------- */
let voice = null;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voice = vs.find(v => /^en/i.test(v.lang) && /(Samantha|Karen|Moira|Tessa|Allison|Ava|Google US English)/.test(v.name))
    || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakToken = 0;
function say(text, { pitch = 1.55, rate = 1.0 } = {}) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) return setTimeout(resolve, 600);
    const my = ++speakToken;
    const words = text.replaceAll('{n}', S.name);
    const u = new SpeechSynthesisUtterance(words);
    if (voice) u.voice = voice; u.pitch = pitch; u.rate = rate;
    let doneCalled = false;
    const done = () => { if (doneCalled) return; doneCalled = true; if (my === speakToken) beep.talking = false; resolve(my === speakToken); };
    u.onend = done; u.onerror = done;
    setTimeout(done, 1500 + words.length * 85);
    beep.talking = true;
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); }
    else speechSynthesis.speak(u);
  });
}

/* ---------------- three.js world ---------------- */
const canvas = $('#game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcdb6f5);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb59ad6, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 10, bottom: -6, near: 1, far: 40 });
scene.add(sun);

const gradientMap = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter; gradientMap.needsUpdate = true;
const matCache = new Map();
function toon(color, extra) {
  const key = String(color) + (extra ? JSON.stringify(extra) : '');
  if (!extra && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap, ...(extra || {}) });
  if (!extra) matCache.set(key, m);

  if (b.panicT > 0) { b.panicT -= dt; const a = time * 6; b.pos.x += Math.cos(a) * dt * 5; b.pos.z += Math.sin(a) * dt * 5; }
  else {
    const tx = clamp(claire.pos.x - claire.dir * 1.5, -11.2, 11.2), tz = clamp(claire.pos.z + 0.9, -2.4, 2.8);
    const d = V3(tx - b.pos.x, 0, tz - b.pos.z);
    if (d.length() > 0.3) b.pos.addScaledVector(d, Math.min(1, dt * 2.2));
  }
  b.pos.z = clamp(b.pos.z, -2.6, 3);
  const shake = b.shakeT > 0 ? Math.sin(time * 60) * 0.06 : 0; b.shakeT -= dt;
  b.g.position.set(b.pos.x + shake, 0.08 + Math.sin(time * 3) * 0.06, b.pos.z);
  let ry = clamp((claire.pos.x - b.pos.x) * 0.25, -0.6, 0.6);
  if (b.spinT > 0) { b.spinT -= dt; b.spinA = (b.spinA || 0) + dt * 18; ry += b.spinA; } else b.spinA = 0;
  b.g.rotation.y = ry;
  b.hv += (-b.hy * 70 - b.hv * 4) * dt; b.hy += b.hv * dt; b.head.position.y = 1.55 + Math.max(-0.2, b.hy);
  if (b.danceT > 0) { b.danceT -= dt; b.body.rotation.z = Math.sin(time * 12) * 0.25; b.arms[0].rotation.z = -1.5 - Math.sin(time * 12); b.arms[1].rotation.z = 1.5 - Math.sin(time * 12); }
  else if (b.wobT > 0) { b.wobT -= dt; b.body.rotation.z = Math.sin(time * 25) * 0.18 * b.wobT; }
  else { b.body.rotation.z *= 0.85; b.arms[0].rotation.z = -0.4; b.arms[1].rotation.z = 0.4; }
  b.wheel.rotation.x += dt * 4;
  if (b.exprT > 0) { b.exprT -= dt; if (b.exprT <= 0) { b.expr = 'idle'; drawFace(); } }
  if (b.talking) { b.mouthT -= dt; if (b.mouthT < 0) { b.mouthT = 0.11; b.mouthOpen = !b.mouthOpen; drawFace(); } b.bulb.material.color.setHex(Math.sin(time * 20) > 0 ? 0xffffff : 0xffd23f); }
  else if (b.mouthOpen) { b.mouthOpen = false; drawFace(); b.bulb.material.color.setHex(0xffd23f); }
}

/* ---------------- tappable things ---------------- */
const things = [];
function thing(obj, def) { obj.userData.thing = def; def.obj = obj; def.taps = 0; things.push(def); return def; }
const worldOf = (o, off = V3()) => o.localToWorld(off.clone());
function stickOn(obj, headObj, offset, secs = 5) {
  headObj.attach(obj); tween(0.2, (k) => obj.position.lerp(offset, k));
  after(secs, () => { if (obj.parent !== headObj) return; scene.attach(obj); const y0 = obj.position.y;
    tween(0.6, (k) => { obj.position.y = y0 - k * y0; obj.rotation.x = k * 2; }, () => scene.remove(obj)); });
}

/* ---------------- adventure 1: The Beeping Mystery ---------------- */
const story = {
  step: 'off', battery: 'drawer', idle: 0,
  reset() {
    this.step = 'intro'; this.battery = 'drawer'; this.idle = 0;
    kitchen.drawer.position.z = -2.72; kitchen.open = false;
    const b = kitchen.battery; kitchen.drawer.add(b); b.position.set(0, 0.1, -0.4); b.rotation.set(0, 0, Math.PI / 2); b.visible = true;
    detector.fixed = false; detector.chirpOn = false; claire.carry = false;
    claire.pos.set(-9, 0, 1); claire.path = []; beep.pos.set(-10.6, 0, 1.8); camX = -7.5;
    setHint(null);
  },
  async start() {
    this.reset(); const tok = ++this.token;
    await say('Hi {n}! It is me, Beep! Shhh. Listen.');
    if (tok !== this.token) return;
    detector.chirpOn = true; detector.next = 0;
    after(1.6, async () => {
      if (tok !== this.token) return;
      await say('Did you hear that? Beep beep! Something is beeping. Let us find it! Tap where you want to go.');
    });
  },
  tapDetector(d) {
    this.idle = 0;
    if (this.step === 'done') { SFX.happySong(); setFace('love', 3); beep.danceT = 3; claire.danceT = 3; say('The smoke detector is singing a happy song!'); return; }
    if (this.battery === 'claire') { this.install(); return; }
    detector.flashT = 0.6; SFX.chirp(0.2);
    this.step = 'need'; setHint(things.find(t => t.id === 'drawer'));
    say("It is the smoke detector! It beeps when it is hungry for a new battery. Can you find a battery? Let's look in the kitchen!");
  },
  tapDrawer(d) {
    this.idle = 0;
    if (this.battery === 'drawer') {
      kitchen.slide(true); SFX.clunk();
      const b = kitchen.battery;
      after(0.4, () => {
        SFX.sparkle();
        flyTo(b, () => worldOf(claire.P.carry), 0.8, 2, () => { claire.P.carry.add(b); b.position.set(0, 0, 0); b.rotation.set(0, 0, Math.PI / 2); claire.carry = true; hop(1, 0.5); });
        this.battery = 'claire'; giveSticker('battery', kitchen.drawer);
        this.step = 'carry'; setHint(things.find(t => t.id === 'detector')); setFace('love', 2.5);
        say('A battery! You found it, {n}! Now give it to the smoke detector. Follow the beeping!');
      });
      return;
    }
    const k = d.taps % 3;
    if (!kitchen.open) { kitchen.slide(true); }
    if (k === 0) { SFX.boing(); say('A silly spoon! Boing boing!'); }
    if (k === 1) { SFX.squawk(); say('A rubber chicken! Bawk bawk!'); claireLaugh(1.5); }
    if (k === 2) { kitchen.slide(false); SFX.clunk(); }
  },
  install() {
    this.battery = 'installed'; claire.carry = false; setHint(null);
    const b = kitchen.battery;
    walkTo(DET_X, -1.0);
    flyTo(b, () => worldOf(detector.g, V3(0, 0, 0.2)), 0.9, 1.5, () => {
      b.visible = false; SFX.click(); detector.chirpOn = false; detector.fixed = true;
      after(0.5, () => this.win());
    });
  },
  win() {
    this.step = 'done';
    finished.add('beeping'); store('claire-adv-done', [...finished]);
    SFX.fanfare(); burst(V3(claire.pos.x, 2.5, claire.pos.z), 100, 7); burst(worldOf(detector.g), 50, 4);
    claire.spinT = 0.6; hop(3, 0.8); beep.danceT = 4; setFace('love', 4);
    giveSticker('fixer', detector.g);
    after(1.4, SFX.happySong);
    say('Click! You fixed it, {n}! The smoke detector is happy now. You are a super fixer!').then(() => {
      if (this.step !== 'done') return;
      say('Now you can play with anything you want. Tap, tap, tap!');
      $('#homeBtn').classList.add('pulse');
    });
  },
  update(dt) {
    if (this.step === 'off' || this.step === 'done') return;
    if (this.step === 'intro' && claire.pos.x > 4.6) { this.step = 'look'; this.idle = 0; setHint(things.find(t => t.id === 'detector')); say('It is getting louder! Look up high! What is beeping?'); }
    this.idle += dt;
    if (this.idle > 16) {
      this.idle = 0;
      const lines = { intro: 'Follow the beeping, {n}! I think it is in your room. Tap over there!', look: 'Look up high! Tap the beeping thing!',
        need: 'The battery is in the kitchen! Tap the yellow drawer!', carry: 'Tap the smoke detector to give it the battery!' };
      if (lines[this.step]) say(lines[this.step]);
      if (this.step === 'intro') setHint(things.find(t => t.id === 'detector'));
    }
  },
  token: 0,
};

  if (moved > 24 || !playing) return;
  initAudio();
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      if (o.userData.thing) { const d = o.userData.thing; story.idle = 0; d.taps++;
        if (d.approach) walkTo(d.approach[0], d.approach[1]);
        d.tap(d); if (STICKERS[d.id]) giveSticker(d.id, d.obj); return; }
      if (o.userData.claire) { SFX.giggle(); claire.spinT = 0.5; hop(1, 0.8); claireLaugh(1); burst(V3(claire.pos.x, 2.6, claire.pos.z), 20, 3); return; }
      if (o.userData.walkable) { const z = h.point.z < -3.5 ? -2.4 : h.point.z; walkTo(h.point.x, z); ripple(clamp(h.point.x, -11.2, 11.2), clamp(z, -2.6, 2.6)); SFX.tap(); return; }
      o = o.parent;
    }
  }
});

function renderBook() {

/* grown-up settings: press and hold the gear */
let holdTimer = null;
const gear = $('#gearBtn');
gear.addEventListener('pointerdown', () => { gear.classList.add('holding'); holdTimer = setTimeout(openSettings, 1200); });
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => gear.addEventListener(ev, () => { gear.classList.remove('holding'); clearTimeout(holdTimer); }));
const HAIRS = ['#a87445', '#2a1a12', '#6b4226', '#a0642f', '#e3b25b', '#f2d58c', '#b5452a', '#8e44d6'];
const SKINS = ['#f7d6c2', '#fde2cf', '#f5d0b5', '#e0ac85', '#b97b55', '#8a5536', '#5b3824'];
const STYLES = [['wavy', 'Long wavy'], ['pigtails', 'Pigtails'], ['bob', 'Bob'], ['ponytail', 'Ponytail'], ['curly', 'Curly']];
function swatches(el, list, key, words) {
  el.innerHTML = '';
  for (const v of list) {
    const val = words ? v[0] : v; const b = document.createElement('button');
    if (words) b.textContent = v[1]; else { b.style.background = v; b.setAttribute('aria-label', v); }
    if (S[key] === val) b.classList.add('sel');
    b.addEventListener('click', () => { S[key] = val; store('claire-adv-settings', S); buildClaire(); swatches(el, list, key, words); });
    el.appendChild(b);
  }
}
function openSettings() {
  gear.classList.remove('holding'); $('#setName').value = S.name;
  swatches($('#hairSw'), HAIRS, 'hair'); swatches($('#skinSw'), SKINS, 'skin'); swatches($('#styleSw'), STYLES, 'style', true);
  $('#settings').hidden = false;
}

  else { e.target.dataset.sure = '1'; e.target.textContent = 'Tap again to clear'; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) AC.resume?.(); });

/* ---------------- loop ---------------- */
let camX = -7.5;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const pipFrame = $('#pipFrame');
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done?.(); } }
  for (let i = timers.length - 1; i >= 0; i--) { const tm = timers[i]; tm.t -= dt; if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); } }
  updateClaire(dt, t); updateBeep(dt, t);
  for (const d of things) d.update?.(dt, t);
  story.update(dt);
  for (const m of confetti) { const u = m.userData; if (u.life <= 0) continue; u.life -= dt; u.v.y -= 9 * dt; u.v.multiplyScalar(0.985); m.position.addScaledVector(u.v, dt); m.rotation.x += dt * 8; m.rotation.y += dt * 5; if (m.position.y < 0.05) { m.position.y = 0.05; u.v.set(0, 0, 0); } if (u.life <= 0) m.visible = false; }
  if (hintTarget) { const p = worldOf(hintTarget.obj); hintStar.position.set(p.x, p.y + 1.4 + Math.sin(t * 4) * 0.2, p.z + 0.6); hintStar.scale.setScalar(0.9 + Math.sin(t * 6) * 0.12); hintStar.material.rotation = Math.sin(t * 2) * 0.3; }

  const aspect = innerWidth / innerHeight;
  const dist = Math.max(10, 5.4 / (Math.tan(THREE.MathUtils.degToRad(21)) * aspect));
  camX += (clamp(claire.pos.x, -7.6, 7.6) - camX) * Math.min(1, dt * 2.5);
  camera.position.set(camX, 2.3 + dist * 0.3, dist + 0.5);
  camera.lookAt(camX, 2.1, -0.6);

  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.render(scene, camera);
  if (secCam.pipT > 0) {
    const w = Math.min(innerWidth * 0.34, 320), hh = w * 0.75, x = innerWidth - w - 20, y = 20;
    secCam.pipCam.aspect = w / hh; secCam.pipCam.updateProjectionMatrix();
    renderer.setScissorTest(true); renderer.setScissor(x, y, w, hh); renderer.setViewport(x, y, w, hh);
    renderer.render(scene, secCam.pipCam); renderer.setScissorTest(false);
    Object.assign(pipFrame.style, { left: (x - 6) + 'px', top: (innerHeight - y - hh - 6) + 'px', width: w + 'px', height: hh + 'px' }); pipFrame.hidden = false;
  } else pipFrame.hidden = true;
  requestAnimationFrame(frame);
}
updateBookCount();
requestAnimationFrame(frame);
</script>
