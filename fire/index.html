<style>
/* Layout: one full-screen night street scene (SVG); three big round tool buttons along the bottom; single dark look. */
:root {
  --ink: #3a1a3c;
  --night: #170f3a;
  --red: #ff3b4f;
  --sun: #ffd23f;
  --water: #5fc8ff;
  --paper: #fffaf2;
  --font: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: linear-gradient(#120b30, #2a1652 60%, #3b3350 60%); color: var(--paper);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
#stage { position: fixed; inset: 0; }
#stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tools { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; gap: 22px; z-index: 5; }
.tool { width: 96px; height: 96px; border-radius: 50%; border: 6px solid var(--paper); background: #3b2a6e; box-shadow: 0 6px 0 #0e0826; display: grid; place-items: center; padding: 0; cursor: pointer; transition: transform .12s; }
.tool svg { width: 60px; height: 60px; }
.tool.on { background: var(--red); transform: translateY(-8px) scale(1.08); box-shadow: 0 10px 0 #8a1424; }
.tool.nudge { animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-14px) scale(1.12); } }
.hud { position: fixed; z-index: 5; width: 76px; height: 76px; border-radius: 50%; border: 5px solid var(--paper); background: #3b2a6e; box-shadow: 0 5px 0 #0e0826; display: grid; place-items: center; padding: 0; cursor: pointer; }
.hud svg { width: 44px; height: 44px; }
#homeBtn { top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); }
#badges { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 18px); right: calc(env(safe-area-inset-right, 0px) + 18px); display: flex; gap: 6px; flex-wrap: wrap; max-width: 46vw; justify-content: flex-end; }

#start { background: radial-gradient(circle at 50% 35%, #ff7a4a 0%, #c42a4a 35%, #2a1652 80%); }
.startInner { display: grid; justify-items: center; gap: 18px; }
.logo { font: 800 clamp(56px, 11vw, 120px)/0.9 var(--font); color: var(--sun); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); letter-spacing: .02em; text-align: center; }
#playBtn { width: 190px; height: 190px; border-radius: 50%; border: 10px solid var(--paper); background: var(--red); box-shadow: 0 12px 0 #8a1424; display: grid; place-items: center; padding: 0; cursor: pointer; animation: nudge 1.4s ease-in-out infinite; }
#playBtn svg { width: 96px; height: 96px; margin-left: 14px; }

<script>
(() => {
'use strict';
const S = { name: 'Claire', hair: '#a87445', skin: '#f7d6c2' };
try { Object.assign(S, JSON.parse(localStorage.getItem('claire-adv-settings') || '{}')); } catch {}

const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ink = '#3a1a3c', NS = 'http://www.w3.org/2000/svg';
const lighten = (hex, amt) => { const n = parseInt(hex.slice(1), 16); const f = (c) => Math.round(c + (255 - c) * amt); return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join(''); };

/* ---------------- sound ---------------- */
let AC = null, master = null, noiseBuf = null;

  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(master); s.start(0);
}
function tone(f, dur, { type = 'sine', vol = 0.2, f2, at = 0, attack = 0.008 } = {}) {
  if (!AC) return; const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);

function noise(dur, { vol = 0.2, freq = 2000, f2, q = 1, type = 'bandpass', at = 0 } = {}) {
  if (!AC) return; const t = AC.currentTime + at, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q; if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
function melody(notes, { bpm = 160, type = 'triangle', vol = 0.14, at = 0 } = {}) { let t = at; const b = 60 / bpm; for (const [n, l] of notes) { if (n) tone(N(n), l * b * 0.95, { type, vol, at: t }); t += l * b; } }
let spray = null;
function sprayOn() { if (!AC || spray) return; const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.6; g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.22, AC.currentTime + 0.08); s.connect(f); f.connect(g); g.connect(master); s.start(); spray = { s, g }; }
function sprayOff() { if (!spray) return; const { s, g } = spray; g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05); s.stop(AC.currentTime + 0.3); spray = null; }
const SFX = {
  siren: (n = 3) => { for (let i = 0; i < n; i++) { tone(620, 0.55, { f2: 980, type: 'triangle', vol: 0.08, at: i * 1.1 }); tone(980, 0.55, { f2: 620, type: 'triangle', vol: 0.08, at: i * 1.1 + 0.55 }); } },
  horn: () => { tone(220, 0.35, { type: 'sawtooth', vol: 0.08 }); tone(277, 0.35, { type: 'sawtooth', vol: 0.06 }); },
  bell: (dur = 1.2) => { for (let t = 0; t < dur; t += 0.08) { tone(1250, 0.12, { type: 'triangle', vol: 0.045, at: t }); tone(1870, 0.1, { vol: 0.025, at: t }); } },
  clunk: () => { tone(90, 0.25, { type: 'square', vol: 0.12, f2: 50 }); noise(0.12, { freq: 700, vol: 0.25 }); tone(120, 1.2, { type: 'sawtooth', vol: 0.02, at: 0.1 }); },
  sizzle: () => noise(0.35, { type: 'highpass', freq: 4000, vol: 0.12 }),
  pfft: () => { noise(0.6, { freq: 1200, f2: 300, vol: 0.25 }); tone(500, 0.3, { f2: 200, vol: 0.08 }); },
  ladder: () => { for (let i = 0; i < 8; i++) tone(300 + i * 40, 0.05, { type: 'square', vol: 0.05, at: i * 0.09 }); },
  pop: () => tone(480, 0.12, { f2: 1100, vol: 0.25 }),
  sparkle: () => [1319, 1568, 2093, 2637].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.1, at: i * 0.06 })),
  cheer: () => { noise(1.2, { freq: 1800, q: 0.4, vol: 0.12 }); [72, 76, 79, 84].forEach((n, i) => tone(N(n), 0.3, { type: 'triangle', vol: 0.08, at: 0.1 + i * 0.1 })); },
  fanfare: () => { melody([[72, 1], [76, 1], [79, 1], [84, 3]], { bpm: 300, type: 'square', vol: 0.07 }); melody([[60, 3], [64, 3]], { bpm: 300, vol: 0.1, at: 0.6 }); melody([[79, 1], [81, 1], [84, 1], [88, 4]], { bpm: 260, type: 'square', vol: 0.06, at: 1.2 }); },
  boing: () => { tone(130, 0.2, { type: 'triangle', f2: 600, vol: 0.25 }); tone(600, 0.35, { type: 'triangle', f2: 160, vol: 0.18, at: 0.18 }); },
  thanks: () => [880, 1046, 1318].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.1, at: i * 0.08 })),
};

/* ---------------- voice: Chief Beep ---------------- */
let voice = null;
function pickVoice() { const vs = window.speechSynthesis ? speechSynthesis.getVoices() : []; voice = vs.find(v => /^en/i.test(v.lang) && /(Samantha|Karen|Moira|Tessa|Allison|Ava|Google US English)/.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakTok = 0, talking = false, lastSay = 0;
function say(text, { pitch = 1.45, rate = 1.0, who = 'chief' } = {}) {
  lastSay = clock;
  return new Promise((res) => {
    if (!window.speechSynthesis) return setTimeout(res, 500);
    const my = ++speakTok, words = text.replaceAll('{n}', S.name), u = new SpeechSynthesisUtterance(words);
    if (voice) u.voice = voice; u.pitch = pitch; u.rate = rate;
    let done = false; const fin = () => { if (done) return; done = true; if (my === speakTok) talking = false; res(); };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 1500 + words.length * 85);
    talking = who === 'chief';
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); } else speechSynthesis.speak(u);
  });
}

/* ---------------- scene ---------------- */
const GROUND = 790, PIVOT = { x: 440, y: 606 }, BX0 = 740, BX1 = 1270, COLS = [820, 1005, 1190];
const FL = [{ x: 300, y: 462, on: false, ang: -0.35 }, { x: 1338, y: 560, on: false, ang: -2.6 }];

const T = (n, x = 0, y = 0, r = 0, sx = 1, sy = sx) => n.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${sx} ${sy})`);
function svgEl(tag, attrs, parent, html) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (html) n.innerHTML = html; (parent || fx).appendChild(n); return n; }
const el = (id) => document.getElementById(id);
const tweens = [], timers = [];
function tween(dur, fn, done) { const tw = { t: 0, dur, fn, done }; tweens.push(tw); fn(0); return tw; }
function after(s, fn) { timers.push({ t: s, fn }); }
const easeOut = (k) => 1 - Math.pow(1 - k, 3);

const stars = Array.from({ length: 70 }, () => `<circle cx="${rand(-300, 1900).toFixed(0)}" cy="${rand(-300, 380).toFixed(0)}" r="${rand(1, 2.6).toFixed(1)}" fill="#fff" class="tw" style="animation-delay:${rand(0, 2).toFixed(2)}s"/>`).join('');

function claireSVG() {

function splash() { for (let i = 0; i < 2; i++) { const c = svgEl('circle', { r: rand(5, 10), fill: '#bfeaff', opacity: 0.9 }); parts.push({ el: c, x: target.x, y: target.y, vx: rand(-260, 260), vy: -rand(80, 300), life: 0.6, g: 900 }); } }
const parts = [];
function steam(x, y, n = 6) { for (let i = 0; i < n; i++) { const c = svgEl('circle', { r: rand(14, 26), fill: '#e8e6f0', opacity: 0.8 }, el('smoke')); parts.push({ el: c, x: x + rand(-30, 30), y: y + rand(-30, 0), vx: rand(-20, 20), vy: -rand(60, 120), life: 1.4, g: -30, grow: 1 }); } }
function smoke(w) { const c = svgEl('circle', { r: rand(16, 28), fill: pick(['#5c5470', '#6e6684', '#4f4862']), opacity: 0.6 }, el('smoke')); parts.push({ el: c, x: w.x + rand(-30, 30), y: w.y - 60, vx: rand(-10, 30), vy: -rand(40, 80), life: 2.6, g: -10, grow: 1 }); }
function confetti(x, y, n = 60) { for (let i = 0; i < n; i++) { const r = svgEl('rect', { width: 12, height: 8, fill: pick(['#ff6fb5', '#ffd23f', '#9b7cf0', '#5fd3ff', '#7dffa6', '#fff']) }); parts.push({ el: r, x, y, vx: rand(-450, 450), vy: -rand(300, 800), life: 2.6, g: 1100, rot: rand(0, 360), vr: rand(-600, 600) }); } }

/* ---------------- rescue ---------------- */
function rescue(w) {
  const p = w.person;
  if (!p || p.saved || ladder.busy) return;
  if (w.fire > 0) { say('Too hot! Spray the fire with water first!'); nudge('water'); return; }
  ladder.busy = true; p.saved = true; SFX.ladder();
  const tx = w.x, ty = w.y + (w.roof ? 0 : 50), a = Math.atan2(ty - PIVOT.y, tx - PIVOT.x) * 180 / Math.PI, len = Math.hypot(tx - PIVOT.x, ty - PIVOT.y) - 10;
  const a0 = ladder.ang, l0 = ladder.len;
  say(pick(['Here comes the ladder!', 'Ladder up!', 'Hold on, we are coming!']));
  tween(1.3, (k) => { const q = easeOut(k); setLadder(a0 + (a - a0) * q, l0 + (len - l0) * q); }, () => {
    const kind = p.kind, g = svgEl('g', {}, fx, `<g class="pa">${PEOPLE[kind].art}</g>`);
    w.pnode.setAttribute('opacity', 0); if (w.roof) w.pnode.remove();
    const pts = [[tx, ty], [PIVOT.x, PIVOT.y], [PIVOT.x + 40, GROUND + 40], [SAFE_X + savedCount() * 46 - 40, GROUND + 22]];
    let seg = 0;
    const legs = [1.6, 0.5, 1.4];
    const walk = () => { if (seg >= 3) { arrive(g, kind); return; } const [x0, y0] = pts[seg], [x1, y1] = pts[seg + 1]; tween(legs[seg], (k) => T(g, x0 + (x1 - x0) * k, y0 + (y1 - y0) * k - (seg === 2 ? Math.abs(Math.sin(k * Math.PI * 6)) * 14 : 0), seg === 0 ? Math.sin(k * 30) * 6 : 0), () => { seg++; walk(); }); };
    walk();
    tween(1.2, (k) => setLadder(a + (-172 - a) * k, len + (300 - len) * k), () => { ladder.busy = false; });
  });
}
const savedCount = () => wins.filter((w) => w.person && w.person.saved).length;
function arrive(g, kind) {
  g.remove(); const s = svgEl('g', {}, el('saved'), `<g class="pa">${PEOPLE[kind].art}</g>`); const x = SAFE_X + (el('saved').children.length - 1) * 46 - 40; T(s, x, GROUND + 22, 0, 0.8);
  tween(0.8, (k) => T(s, x, GROUND + 22 - Math.abs(Math.sin(k * Math.PI * 2)) * 30, 0, 0.8));
  SFX.thanks(); say(`Thank you! You saved ${PEOPLE[kind].name}!`, { pitch: 1.9, rate: 1.15, who: 'friend' }); confetti(x, GROUND - 40, 20);
  checkWin();
}

/* ---------------- win / guide ---------------- */
function checkWin() {
  if (won) return;
  if (wins.every((w) => w.fire <= 0 && (!w.person || w.person.saved))) {
    won = true; after(1.2, () => {
      SFX.fanfare(); SFX.cheer(); confetti(800, 300, 120); confetti(1200, 300, 80); badges++; try { localStorage.setItem('claire-fire-badges', badges); } catch {} drawBadges();
      say(pick(['You did it, {n}! Everyone is safe! You are a real firefighter!', 'Hooray! All the fires are out and everyone is safe! Great job, Firefighter {n}!']));
      after(3, () => { $('#nextBtn').hidden = false; });
    });
  }
}
function drawBadges() { $('#badges').innerHTML = Array.from({ length: Math.min(badges, 12) }, () => `<svg viewBox="0 0 40 46"><path d="M20 2 L37 9 V22 C37 33 29 41 20 44 C11 41 3 33 3 22 V9 Z" fill="#ffd23f" stroke="#3a1a3c" stroke-width="3"/><path d="M20 12l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#ff3b4f"/></svg>`).join(''); }
function nudge(t) { document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('nudge', b.dataset.tool === t)); }
let idle = 0;
function guide(force) {
  if (won) return;
  const hidden = wins.find((w) => w.person && !w.person.saved && !w.person.revealed && !w.lit);
  const fire = wins.find((w) => w.fire > 0);
  const waiting = wins.find((w) => w.person && !w.person.saved && (w.person.revealed || w.lit) && w.fire <= 0);
  let line = '', t = null, h = null;
  if (hidden && !FL.some((f) => f.on)) { line = 'It is dark! Use the floodlight button, then point the light at the windows!'; t = 'light'; h = [hidden.x, hidden.y]; }
  else if (fire) { line = pick(['Spray the fire! Tap the water button, then hold your finger on the fire!', 'Put out the fire with water!']); t = 'water'; h = [fire.x, fire.y - 70]; }
  else if (waiting) { line = 'Someone needs help! Tap the ladder button, then tap them!'; t = 'ladder'; h = [waiting.x, waiting.y - 70]; }
  else if (hidden) { line = 'Someone is still hiding in the dark! Shine the floodlight on the windows!'; t = 'light'; h = [hidden.x, hidden.y]; }
  nudge(t); hintAt(h);
  if (line && force) say(line);
}
let hintPos = null; function hintAt(h) { hintPos = h; el('hint').setAttribute('visibility', h ? 'visible' : 'hidden'); }

/* ---------------- input ---------------- */
function toWorld(cx, cy) { const p = world.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(world.getScreenCTM().inverse()); }
let downAt = null;
world.addEventListener('pointerdown', (e) => {
  if (!playing) return; initAudio(); idle = 0;
  const p = toWorld(e.clientX, e.clientY); downAt = { x: e.clientX, y: e.clientY };
  const tapT = e.target.closest('[data-tap]'), winT = e.target.closest('[data-win]');
  if (tapT) {
    const k = tapT.dataset.tap;
    if (k === 'fl0') { toggleFlood(0); return; } if (k === 'fl1') { toggleFlood(1); return; }
    if (k === 'truck') { SFX.horn(); SFX.siren(1); lightsT = 3; return; }
    if (k === 'chief') { SFX.boing(); chiefHop = 0.6; say(pick(['Chief Beep reporting for duty!', 'Beep boop! You are doing great, {n}!', 'Safety first!'])); return; }
  }
  if (tool === 'ladder') {
    const w = winT ? wins[+winT.dataset.win] : nearestPersonWin(p);
    if (w && w.person && !w.person.saved && (w.person.revealed || w.lit || w.fire > 0)) { setTool('ladder'); rescue(w); }
    else if (w && w.person && !w.person.saved) { say('It is too dark to see! Shine the floodlight first!'); nudge('light'); }
    else if (tool === 'ladder') { SFX.pop(); say('Tap a window where someone needs help!'); }
    return;
  }
  if (tool === 'light') { aimFloods(p.x, p.y); world.setPointerCapture?.(e.pointerId); dragging = true; return; }
  if (tool === 'water') { target = { x: p.x, y: p.y }; spraying = true; sprayOn(); world.setPointerCapture?.(e.pointerId); }
});
let dragging = false;
world.addEventListener('pointermove', (e) => { if (!playing) return; const p = toWorld(e.clientX, e.clientY); if (spraying) target = { x: p.x, y: p.y }; else if (dragging) aimFloods(p.x, p.y); });
const stop = () => { if (spraying) { spraying = false; sprayOff(); } dragging = false; };
world.addEventListener('pointerup', stop); world.addEventListener('pointercancel', stop);
function nearestPersonWin(p) { let best = null, bd = 160; for (const w of wins) { if (!w.person || w.person.saved) continue; const d = Math.hypot(w.x - p.x, w.y - p.y); if (d < bd) { bd = d; best = w; } } return best; }
function setTool(t) { tool = t; document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.tool === t)); }
document.querySelectorAll('.tool').forEach((b) => b.addEventListener('click', () => { initAudio(); setTool(b.dataset.tool); SFX.pop(); idle = 0; b.classList.remove('nudge');
  say({ light: 'Floodlights! Point them at the windows!', water: 'Water hose! Hold your finger on the fire!', ladder: 'Ladder! Tap someone who needs help!' }[b.dataset.tool]); }));
$('#nextBtn').addEventListener('click', () => { initAudio(); SFX.pop(); startLevel(level + 1); });
$('#homeBtn').addEventListener('click', () => { playing = false; stop(); $('#start').hidden = false; $('#tools').hidden = true; $('#homeBtn').hidden = true; $('#nextBtn').hidden = true; });
$('#playBtn').addEventListener('click', () => { initAudio(); $('#start').hidden = true; $('#tools').hidden = false; $('#homeBtn').hidden = false; startLevel(level || 0); });

let lightsT = 0, chiefHop = 0, alarmT = 0;
function startLevel(n) {
  buildLevel(n); FL.forEach((f) => { f.on = false; }); setTool('water'); playing = true; idle = 0;
  const tr = el('truck'), cl = el('claire');
  tween(2.2, (k) => { const x = (1 - easeOut(k)) * -700; tr.setAttribute('transform', `translate(${x} 0)`); cl.setAttribute('transform', `translate(${560 + x} ${GROUND})`); });
  SFX.siren(2); lightsT = 4;
  say(n === 0 ? 'Fire! Fire! Firefighter {n}, we need your help! Let us put out the fires and save everyone!' : pick(['Another fire! Let us go, Firefighter {n}!', 'Here we go again! Lights, water, ladder!'])).then(() => after(0.5, () => guide(true)));
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done?.(); } }
  for (let i = timers.length - 1; i >= 0; i--) { const tm = timers[i]; tm.t -= dt; if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); } }
  if (playing && L) {
    drawFloods();
    const n = nozzle();
    T(el('cArmR'), 34, -196, n.a * 180 / Math.PI - 90);
    el('hose').setAttribute('d', `M480,700 Q520,${GROUND + 30} ${n.x - Math.cos(n.a) * 40},${n.y - Math.sin(n.a) * 40}`); el('hose2').setAttribute('d', el('hose').getAttribute('d'));
    const st = el('stream');
    if (spraying) {
      const d = streamPath(n); ['streamOut', 'streamIn', 'streamHi'].forEach((id) => el(id).setAttribute('d', d)); el('streamHi').setAttribute('stroke-dashoffset', -clock * 400); st.setAttribute('opacity', 1); splash();
      for (const w of wins) if (w.fire > 0 && Math.hypot(w.x - target.x, w.y + 10 - target.y) < 110) {
        w.fire -= dt * 0.75; lastHit[w.i] = clock; if (Math.random() < dt * 6) { SFX.sizzle(); steam(w.x, w.y); }
        if (w.fire <= 0) { w.fire = 0; w.out = true; SFX.pfft(); steam(w.x, w.y, 14); const fl = w.flame; tween(0.5, (k) => fl.setAttribute('opacity', 1 - k), () => fl.remove()); say(pick(['Fire out! Great job!', 'Psssh! You put it out!', 'Bye bye, fire!'])); checkWin(); }
      }
    } else st.setAttribute('opacity', 0);
    let anyFire = false;
    for (const w of wins) {
      if (w.fire > 0) { anyFire = true;
        if (!lastHit[w.i] || clock - lastHit[w.i] > 1.6) w.fire = Math.min(1, w.fire + dt * 0.04);
        const hit = lastHit[w.i] && clock - lastHit[w.i] < 0.2, s = 0.45 + 0.55 * w.fire, fl = Math.sin(clock * 12 + w.i) * 0.06;
        T(w.flame, w.x, w.y + 44 - (hit ? 4 : 0), Math.sin(clock * 5 + w.i) * 4, s * (1 + fl), s * (1 - fl + (hit ? -0.1 : 0)));
        const m = w.flame.querySelector('.fm'); if (m) m.setAttribute('d', hit ? 'M-8,-18 a8,8 0 1 0 16,0 a8,8 0 1 0 -16,0' : 'M-8,-20 q8,6 16,0');
        if (Math.random() < dt * 2.2) smoke(w);
      }
      if (w.person && !w.person.saved && w.pnode) { const pa = w.pnode.querySelector('.pa'); if (pa) pa.setAttribute('transform', `rotate(${Math.sin(clock * 8 + w.i) * 6})`); }
    }
    updateWindows(dt);
    alarmT -= dt; if (anyFire && alarmT <= 0) { alarmT = 4; SFX.bell(0.8); }
    el('bRays')?.setAttribute('opacity', anyFire ? 0.9 : 0); el('bRays')?.setAttribute('transform', `rotate(${clock * 200})`);
    idle += dt; if (idle > 13) { idle = 0; guide(true); } else if (Math.floor(clock * 2) % 4 === 0) guide(false);
  }
  lightsT -= dt; const on = lightsT > 0 || (L && !won);
  el('tl1').setAttribute('fill', on && Math.sin(clock * 6) > 0 ? '#ff3355' : '#7a2030'); el('tl2').setAttribute('fill', on && Math.sin(clock * 6) <= 0 ? '#4d7bff' : '#1f2f6a');
  el('ambL').setAttribute('fill', Math.sin(clock * 5) > 0 ? '#4d7bff' : '#ff3355');
  chiefHop -= dt; el('chief').setAttribute('transform', `translate(100 ${536 - (chiefHop > 0 ? Math.sin(chiefHop * 10) * 20 : 0)}) scale(.62)`);
  if (talking) { if (Math.floor(clock * 9) % 2 !== +mouthOpen) { mouthOpen = !mouthOpen; drawChief(); } } else if (mouthOpen) { mouthOpen = false; drawChief(); }
  if (hintPos) T(el('hint'), hintPos[0], hintPos[1] + Math.sin(clock * 4) * 12, Math.sin(clock * 2) * 15, 1 + Math.sin(clock * 6) * 0.1);
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot !== undefined) p.rot += p.vr * dt;
    p.el.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${p.rot || 0}) scale(${p.grow ? 1 + (1.4 - p.life) * 0.5 : 1})`); p.el.setAttribute('opacity', Math.max(0, Math.min(1, p.life))); if (p.life <= 0) { p.el.remove(); parts.splice(i, 1); } }
  requestAnimationFrame(frame);
}
drawBadges();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) AC.resume?.(); });
})();
</script>
